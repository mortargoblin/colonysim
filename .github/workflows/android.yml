name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest ships the Android SDK (ANDROID_HOME); AGP fetches any
      # missing platform/build-tools on demand.
      - name: Check Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME"

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "COLONYSIM_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Compute version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "name=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            echo "tag=v1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Test and build
        env:
          COLONYSIM_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          COLONYSIM_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          COLONYSIM_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: >
          ./gradlew --no-daemon :core:test :app:assembleRelease
          -PversionCode=${{ github.run_number }}
          -PversionName=${{ steps.version.outputs.name }}

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/tiny-colony-${{ steps.version.outputs.name }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: tiny-colony-apk
          path: dist/*.apk

      - name: Publish GitHub release
        if: >
          github.event_name != 'pull_request' &&
          (startsWith(github.ref, 'refs/tags/v') ||
           github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
           github.event_name == 'workflow_dispatch')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Tiny Colony ${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          files: dist/*.apk
          generate_release_notes: true
